<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="PyLadder: Python practice for CITS1401 students. Topics, coding questions, hints, and reports on strengths and weak spots." />
<title>PyLadder · CITS1401 Python practice</title>
<link rel="icon" type="image/svg+xml" href="./pyladder-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<script>
  // Apply saved theme before first paint, and warn when opened from the file system.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('pyladder:settings') || '{}');
      var theme = s.theme || 'system';
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
      }
      var accent = s.accent || 'blue-gold';
      if (accent !== 'mono') document.documentElement.setAttribute('data-accent', accent);
      if (s.reducedMotion === 'on') document.documentElement.setAttribute('data-motion', 'reduce');
    } catch (e) {}
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var b = document.createElement('div');
        b.setAttribute('role', 'alert');
        b.style.cssText = 'padding:12px 16px;background:#fbe8e6;color:#8a2019;font:14px system-ui;border-bottom:1px solid #eeb0aa';
        b.textContent = 'PyLadder cannot run Python when opened as a file. Run "npm run dev" or use the hosted link.';
        document.body.prepend(b);
      });
    }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
