<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="PyLadder: Python practice for CITS1401 students. Topics, coding questions, hints, and reports on strengths and weak spots." />
<title>PyLadder · CITS1401 Python practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232c64a3'/%3E%3Cpath d='M10 7v18M22 7v18M10 12h12M10 18h12' stroke='%23f2c230' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<script>
  // Apply saved theme before first paint, and warn when opened from the file system.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('pyladder:settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      if (s.reducedMotion === 'on') document.documentElement.setAttribute('data-motion', 'reduce');
    } catch (e) {}
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var b = document.createElement('div');
        b.setAttribute('role', 'alert');
        b.style.cssText = 'padding:12px 16px;background:#fbe8e6;color:#8a2019;font:14px system-ui;border-bottom:1px solid #eeb0aa';
        b.textContent = 'PyLadder cannot run Python when opened as a file. Run "npm run dev" or use the hosted link.';
        document.body.prepend(b);
      });
    }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
